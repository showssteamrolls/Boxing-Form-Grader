<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Boxing Form Grader</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a0a0c; color: #eee; font-family: 'Inter', -apple-system, sans-serif; }

  /* ---------------- HERO ---------------- */
  .hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    padding: 60px 8vw;
    gap: 48px;
  }

  .demo-tile-wrap {
    position: relative;
    flex: 0 0 auto;
    width: 34%;
    max-width: 460px;
  }

  .me-arrow {
    position: absolute;
    left: auto;
    right: -230px;
    bottom: 20px;
    width: 220px;
    transform: rotate(-6deg);
    pointer-events: none;
    z-index: 5;
  }
  .me-arrow img { width: 100%; height: auto; display: block; }
  @media (max-width: 1100px) {
    .me-arrow { display: none; }
  }

  .demo-tile {
    flex: 0 0 auto;
    width: 34%;
    max-width: 460px;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .demo-tile video, .demo-tile canvas {
    display: block;
    width: 100%;
    height: auto;
  }
  .demo-tile canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  .demo-tile-wrap .demo-tile {
    flex: unset;
    width: 100%;
    max-width: none;
  }

  .demo-caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
    padding: 14px 16px 10px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .demo-caption .title { font-family: 'Oswald', sans-serif; font-size: 0.9rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.03em; }
  .demo-caption .title .tag { display: block; font-family: 'Inter', sans-serif; font-size: 0.66rem; font-weight: 400; text-transform: none; letter-spacing: 0; color: rgba(255,255,255,0.55); margin-top: 3px; }
  .demo-caption .scores { display: flex; gap: 16px; }
  .demo-caption .side { text-align: right; }
  .demo-caption .lbl { font-family: 'Oswald', sans-serif; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; color: rgba(255,255,255,0.5); }
  .demo-caption .val { font-family: 'Space Grotesk', monospace; font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .demo-caption .val.good { color: #4fdc7a; }
  .demo-caption .val.bad { color: #ff5c5c; }

  .text-col {
    flex: 1 1 auto;
    max-width: 380px;
    text-align: center;
  }
  .text-col h1 {
    font-family: 'Oswald', sans-serif;
    font-size: 2.5rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    line-height: 1.08;
    margin-bottom: 18px;
  }
  .text-col p { color: rgba(255,255,255,0.6); font-size: 0.98rem; line-height: 1.6; margin-bottom: 28px; }
  .cta-btn {
    display: inline-block;
    background: #fff;
    color: #0a0a0c;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 14px 28px;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    border: none;
  }
  .cta-btn:hover { background: #e5e5e5; }

  @media (max-width: 1100px) {
    .hero { flex-direction: column; align-items: stretch; padding: 40px 24px; }
    .demo-tile { width: 100%; max-width: none; }
    .demo-tile-wrap { width: 100%; max-width: none; }
    .text-col { max-width: none; order: -1; margin-bottom: 24px; }
  }

  /* ---------------- ARCHITECTURE (reserved, empty for now) ---------------- */
  .architecture-section {
    min-height: 6vh;
  }

  /* ---------------- UPLOAD SECTION ---------------- */
  .upload-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 60px 20px 100px;
    background: #111114;
  }
  .upload-section h2 { font-family: 'Oswald', sans-serif; font-size: 1.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 6px; }
  .upload-section p { color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 28px; }

  .drop-zone {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 16 / 10;
    border: 2px dashed rgba(255,255,255,0.25);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .drop-zone:hover { border-color: rgba(255,255,255,0.5); }
  .drop-zone.has-video { border-style: solid; cursor: default; }
  .drop-zone input[type="file"] { display: none; }
  .drop-prompt { text-align: center; color: rgba(255,255,255,0.45); font-size: 0.85rem; }
  .drop-prompt .icon { font-size: 2rem; display: block; margin-bottom: 8px; }
  .drop-zone video, .drop-zone canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
  }
  .drop-zone canvas { pointer-events: none; }

  .upload-scores { display: flex; gap: 16px; margin-top: 20px; }
  .upload-scores .side {
    background: #1a1a1e; border: 1px solid #2a2a30; border-radius: 10px;
    padding: 10px 18px; text-align: center; min-width: 90px;
  }
  .upload-scores .lbl { font-family: 'Oswald', sans-serif; font-size: 0.68rem; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.04em; }
  .upload-scores .val { font-family: 'Space Grotesk', monospace; font-size: 1.5rem; font-weight: 700; margin-top: 2px; }
  .upload-scores .val.good { color: #4fdc7a; }
  .upload-scores .val.bad { color: #ff5c5c; }
</style>
</head>
<body>

<div class="hero">
  <div class="demo-tile-wrap">
    <div class="demo-tile">
      <video id="mainVideo" autoplay muted loop playsinline></video>
      <canvas id="mainCanvas"></canvas>
      <div class="demo-caption">
        <div class="title">Technique Drill: Cross<span class="tag">Focusing on proper pivot and rotation.</span></div>
        <div class="scores">
          <div class="side"><div class="lbl">L</div><div class="val" id="mainLeft">--</div></div>
          <div class="side"><div class="lbl">R</div><div class="val" id="mainRight">--</div></div>
        </div>
      </div>
    </div>

    <div class="me-arrow">
      <img src="assets/me-arrow.png" alt="Me!" />
    </div>
  </div>

  <div class="text-col">
    <h1>Boxing Form Grader</h1>
    <p>REAL-TIME PUNCH-FORM SCORING</p>
    <a class="cta-btn" href="#upload">Upload your own clip →</a>
  </div>

  <div class="demo-tile">
    <video id="miniVideo" autoplay muted loop playsinline></video>
    <canvas id="miniCanvas"></canvas>
    <div class="demo-caption">
      <div class="title">Bivol Shadowboxing<span class="tag">Pro who I aspire to box like.</span></div>
      <div class="scores">
        <div class="side"><div class="lbl">L</div><div class="val" id="miniLeft">--</div></div>
        <div class="side"><div class="lbl">R</div><div class="val" id="miniRight">--</div></div>
      </div>
    </div>
  </div>
</div>

<div class="architecture-section"></div>

<div class="upload-section" id="upload">
  <h2>Upload your own clip</h2>
  <div class="drop-zone" id="uploadZone">
    <input type="file" accept="video/*" />
    <div class="drop-prompt">
      CLICK OR DRAG A CLIP HERE
    </div>
    <video style="display:none"></video>
    <canvas style="display:none"></canvas>
  </div>
  <div class="upload-scores">
    <div class="side"><div class="lbl">Left</div><div class="val" id="uploadLeft">--</div></div>
    <div class="side"><div class="lbl">Right</div><div class="val" id="uploadRight">--</div></div>
  </div>
</div>

<script type="module">
import {
  PoseLandmarker,
  FilesetResolver,
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ---------------------------------------------------------------------------
// CONFIG — ported 1:1 from src/config.py DEFAULT_CONFIG.
// ---------------------------------------------------------------------------
const CONFIG = {
  minLandmarkVisibility: 0.6,
  smoothing: { alpha: 0.35, maxHoldFrames: 8 },
  thresholds: {
    elbowExtensionDeg: { minGood: 155, maxGood: 180, tolerance: 25 },
    hipRotationDeg: { minGood: 30, maxGood: 70, tolerance: 20 },
    guardHeightRatio: { minGood: 0.85, maxGood: 1.15, tolerance: 0.35 },
    punchAngularVelocityDps: { minGood: 400, maxGood: 1400, tolerance: 300 },
  },
  scoreWeights: {
    elbowExtensionDeg: 0.35,
    hipRotationDeg: 0.30,
    guardHeightRatio: 0.20,
    punchAngularVelocityDps: 0.15,
  },
  punchDetection: { wristVelocityTriggerDps: 300, minFramesBetweenPunches: 6 },
  overlay: { minVisibilityToDraw: 0.3 },
};

const LANDMARK = {
  LEFT_SHOULDER: 11, RIGHT_SHOULDER: 12,
  LEFT_ELBOW: 13, RIGHT_ELBOW: 14,
  LEFT_WRIST: 15, RIGHT_WRIST: 16,
  LEFT_HIP: 23, RIGHT_HIP: 24,
};

const POSE_CONNECTIONS = [
  [11, 12], [11, 13], [13, 15], [12, 14], [14, 16],
  [11, 23], [12, 24], [23, 24], [23, 25], [24, 26],
];

const MODEL_URL =
  "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task";

// ---------------------------------------------------------------------------
// Pure math — ported from src/features.py and src/scoring.py
// ---------------------------------------------------------------------------
function angleDeg(a, b, c) {
  const ba = { x: a.x - b.x, y: a.y - b.y };
  const bc = { x: c.x - b.x, y: c.y - b.y };
  const dot = ba.x * bc.x + ba.y * bc.y;
  const magBa = Math.hypot(ba.x, ba.y);
  const magBc = Math.hypot(bc.x, bc.y);
  const cos = Math.min(1, Math.max(-1, dot / (magBa * magBc + 1e-8)));
  return (Math.acos(cos) * 180) / Math.PI;
}
function elbowExtension(lm, side) {
  const s = lm[LANDMARK[`${side.toUpperCase()}_SHOULDER`]];
  const e = lm[LANDMARK[`${side.toUpperCase()}_ELBOW`]];
  const w = lm[LANDMARK[`${side.toUpperCase()}_WRIST`]];
  return angleDeg(s, e, w);
}
function hipRotation(lm) {
  const lHip = lm[LANDMARK.LEFT_HIP], rHip = lm[LANDMARK.RIGHT_HIP];
  const lSh = lm[LANDMARK.LEFT_SHOULDER], rSh = lm[LANDMARK.RIGHT_SHOULDER];
  const hipVec = { x: rHip.x - lHip.x, y: rHip.y - lHip.y };
  const shVec = { x: rSh.x - lSh.x, y: rSh.y - lSh.y };
  const hipAngle = (Math.atan2(hipVec.y, hipVec.x) * 180) / Math.PI;
  const shAngle = (Math.atan2(shVec.y, shVec.x) * 180) / Math.PI;
  const diff = Math.abs(hipAngle - shAngle);
  return Math.min(diff, 360 - diff);
}
function guardHeightRatio(lm, side) {
  const shoulder = lm[LANDMARK[`${side.toUpperCase()}_SHOULDER`]];
  const wrist = lm[LANDMARK[`${side.toUpperCase()}_WRIST`]];
  const hip = lm[LANDMARK[`${side.toUpperCase()}_HIP`]];
  const torsoLen = Math.abs(hip.y - shoulder.y) + 1e-6;
  const heightAboveShoulder = shoulder.y - wrist.y;
  return 1.0 + heightAboveShoulder / torsoLen;
}
function metricSubscore(value, { minGood, maxGood, tolerance }) {
  if (value >= minGood && value <= maxGood) return 100;
  const deficit = value < minGood ? minGood - value : value - maxGood;
  if (deficit >= tolerance) return 0;
  return 100 * (1 - deficit / tolerance);
}
function scorePunch(features, side) {
  const otherSide = side === "right" ? "left" : "right";
  const values = {
    elbowExtensionDeg: features.elbowExtensionDeg[side],
    hipRotationDeg: features.hipRotationDeg,
    guardHeightRatio: features.guardHeightRatio[otherSide],
    punchAngularVelocityDps: features.wristAngularVelocityDps[side],
  };
  const subScores = {};
  for (const metric in values) subScores[metric] = metricSubscore(values[metric], CONFIG.thresholds[metric]);
  let composite = 0;
  for (const metric in CONFIG.scoreWeights) composite += subScores[metric] * CONFIG.scoreWeights[metric];
  return { composite, subScores };
}

// ---------------------------------------------------------------------------
// One Grader per video element.
// ---------------------------------------------------------------------------
class Grader {
  constructor(video, canvas, onScore) {
    this.video = video;
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.onScore = onScore || (() => {});
    this.landmarker = null;
    this.rafId = null;
    this.lastVideoTime = -1;
    this.monotonicTs = -1;
    this.smoothed = null;
    this.holdCounts = new Array(33).fill(0);
    this.prevWristVec = { left: null, right: null };
    this.prevTimestampMs = null;
    this.framesSinceLast = { left: 999, right: 999 };
  }

  async init(filesetResolver) {
    try {
      this.landmarker = await PoseLandmarker.createFromOptions(filesetResolver, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: "GPU" },
        runningMode: "VIDEO",
        numPoses: 1,
      });
    } catch (err) {
      console.warn("GPU delegate failed, falling back to CPU:", err);
      this.landmarker = await PoseLandmarker.createFromOptions(filesetResolver, {
        baseOptions: { modelAssetPath: MODEL_URL, delegate: "CPU" },
        runningMode: "VIDEO",
        numPoses: 1,
      });
    }
  }

  start() {
    const resize = () => {
      this.canvas.width = this.video.videoWidth || this.canvas.clientWidth;
      this.canvas.height = this.video.videoHeight || this.canvas.clientHeight;
    };
    if (this.video.readyState >= 1) resize();
    else this.video.addEventListener("loadedmetadata", resize, { once: true });
    this._loop();
  }

  _loop() {
    if (this.landmarker && this.video.readyState >= 2 && this.video.currentTime !== this.lastVideoTime) {
      this.lastVideoTime = this.video.currentTime;
      const timestampMs = this.video.currentTime * 1000;
      const landmarkerTs = Math.max(Math.round(timestampMs), this.monotonicTs + 1);
      this.monotonicTs = landmarkerTs;
      let result;
      try {
        result = this.landmarker.detectForVideo(this.video, landmarkerTs);
      } catch (err) {
        this.rafId = requestAnimationFrame(() => this._loop());
        return;
      }

      if (result.landmarks && result.landmarks.length > 0) {
        const raw = result.landmarks[0];
        const visibility = raw.map((p) => (p.visibility ?? 1.0));
        const sm = this._updateSmoothing(raw, visibility);
        this._drawOverlay(sm, visibility);
        const features = this._computeFeatures(sm, timestampMs);
        const triggered = this._checkPunch(features);
        for (const side of triggered) this.onScore(side, scorePunch(features, side));
      } else {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      }
    }
    this.rafId = requestAnimationFrame(() => this._loop());
  }

  _updateSmoothing(landmarks, visibility) {
    if (!this.smoothed) {
      this.smoothed = landmarks.map((p) => ({ x: p.x, y: p.y }));
      return this.smoothed;
    }
    const a = CONFIG.smoothing.alpha;
    const next = this.smoothed.map((p) => ({ ...p }));
    for (let i = 0; i < landmarks.length; i++) {
      const visible = visibility[i] >= CONFIG.minLandmarkVisibility;
      const forcedSnap = this.holdCounts[i] >= CONFIG.smoothing.maxHoldFrames;
      if (visible || forcedSnap) {
        next[i].x = a * landmarks[i].x + (1 - a) * this.smoothed[i].x;
        next[i].y = a * landmarks[i].y + (1 - a) * this.smoothed[i].y;
        this.holdCounts[i] = 0;
      } else {
        this.holdCounts[i] += 1;
      }
    }
    this.smoothed = next;
    return this.smoothed;
  }

  _computeFeatures(lm, timestampMs) {
    const result = {
      elbowExtensionDeg: { left: elbowExtension(lm, "left"), right: elbowExtension(lm, "right") },
      hipRotationDeg: hipRotation(lm),
      guardHeightRatio: { left: guardHeightRatio(lm, "left"), right: guardHeightRatio(lm, "right") },
      wristAngularVelocityDps: {},
    };
    let dtS = null;
    if (this.prevTimestampMs !== null) dtS = (timestampMs - this.prevTimestampMs) / 1000;
    for (const side of ["left", "right"]) {
      const shoulder = lm[LANDMARK[`${side.toUpperCase()}_SHOULDER`]];
      const wrist = lm[LANDMARK[`${side.toUpperCase()}_WRIST`]];
      const curr = { x: wrist.x - shoulder.x, y: wrist.y - shoulder.y };
      const currAngle = (Math.atan2(curr.y, curr.x) * 180) / Math.PI;
      const prev = this.prevWristVec[side];
      if (!prev || !dtS || dtS <= 0) {
        result.wristAngularVelocityDps[side] = 0;
      } else {
        const prevAngle = (Math.atan2(prev.y, prev.x) * 180) / Math.PI;
        let delta = Math.abs(currAngle - prevAngle);
        delta = Math.min(delta, 360 - delta);
        result.wristAngularVelocityDps[side] = delta / dtS;
      }
      this.prevWristVec[side] = curr;
    }
    this.prevTimestampMs = timestampMs;
    return result;
  }

  _checkPunch(features) {
    const triggered = [];
    for (const side of ["left", "right"]) {
      this.framesSinceLast[side] += 1;
      const speed = features.wristAngularVelocityDps[side];
      if (speed >= CONFIG.punchDetection.wristVelocityTriggerDps &&
          this.framesSinceLast[side] >= CONFIG.punchDetection.minFramesBetweenPunches) {
        triggered.push(side);
        this.framesSinceLast[side] = 0;
      }
    }
    return triggered;
  }

  _drawOverlay(landmarks, visibility) {
    const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
    ctx.clearRect(0, 0, w, h);
    // High-contrast colors so the overlay reads against any background
    // (a plain white stroke disappears against light walls/garage doors).
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#00e5ff";
    ctx.shadowColor = "rgba(0,0,0,0.8)";
    ctx.shadowBlur = 3;
    for (const [a, b] of POSE_CONNECTIONS) {
      if (visibility[a] < CONFIG.overlay.minVisibilityToDraw || visibility[b] < CONFIG.overlay.minVisibilityToDraw) continue;
      ctx.beginPath();
      ctx.moveTo(landmarks[a].x * w, landmarks[a].y * h);
      ctx.lineTo(landmarks[b].x * w, landmarks[b].y * h);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#ff2fb0";
    landmarks.forEach((p, i) => {
      if (visibility[i] < CONFIG.overlay.minVisibilityToDraw) return;
      ctx.beginPath();
      ctx.arc(p.x * w, p.y * h, 4, 0, 2 * Math.PI);
      ctx.fill();
    });
  }
}

// ---------------------------------------------------------------------------
// Wire it up
// ---------------------------------------------------------------------------
let filesetResolverPromise = null;
function getFilesetResolver() {
  if (!filesetResolverPromise) {
    filesetResolverPromise = FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
  }
  return filesetResolverPromise;
}

function updateReadout(valEl, result) {
  const rounded = Math.round(result.composite);
  valEl.textContent = rounded;
  valEl.className = "val " + (result.composite >= 75 ? "good" : "bad");
}

async function startAutoClip(video, canvas, leftEl, rightEl, src) {
  video.src = src;
  const fsr = await getFilesetResolver();
  const grader = new Grader(video, canvas, (side, result) => {
    updateReadout(side === "left" ? leftEl : rightEl, result);
  });
  await grader.init(fsr);
  grader.start();
}

// Single-person footage only — MediaPipe's single-pose model (numPoses: 1)
// can flip between people frame-to-frame if more than one person is in
// frame, producing garbage angle/velocity readings. Use a solo clip here;
// save multi-person clips (sparring) for a future multi-pose version.
startAutoClip(
  document.getElementById("mainVideo"),
  document.getElementById("mainCanvas"),
  document.getElementById("mainLeft"),
  document.getElementById("mainRight"),
  "sample-clips/cross_cue.mp4"
);

// Secondary mini-player — kept as a two-person clip on purpose, labeled
// "experimental" since numPoses:1 can flip between people frame-to-frame.
startAutoClip(
  document.getElementById("miniVideo"),
  document.getElementById("miniCanvas"),
  document.getElementById("miniLeft"),
  document.getElementById("miniRight"),
  "sample-clips/bivol.mp4"
);

// ---- Upload section ----
const uploadZone = document.getElementById("uploadZone");
const uploadInput = uploadZone.querySelector('input[type="file"]');
const uploadPrompt = uploadZone.querySelector(".drop-prompt");
const uploadVideo = uploadZone.querySelector("video");
const uploadCanvas = uploadZone.querySelector("canvas");
const uploadLeftEl = document.getElementById("uploadLeft");
const uploadRightEl = document.getElementById("uploadRight");

async function handleUpload(file) {
  if (!file) return;
  uploadPrompt.style.display = "none";
  uploadVideo.style.display = "block";
  uploadCanvas.style.display = "block";
  uploadZone.classList.add("has-video");
  uploadVideo.src = URL.createObjectURL(file);
  uploadVideo.loop = true;
  uploadVideo.muted = true;
  uploadVideo.playsInline = true;
  await uploadVideo.play();

  const fsr = await getFilesetResolver();
  const grader = new Grader(uploadVideo, uploadCanvas, (side, result) => {
    updateReadout(side === "left" ? uploadLeftEl : uploadRightEl, result);
  });
  await grader.init(fsr);
  grader.start();
}

uploadZone.addEventListener("click", () => uploadInput.click());
uploadInput.addEventListener("change", (e) => handleUpload(e.target.files[0]));
uploadZone.addEventListener("dragover", (e) => e.preventDefault());
uploadZone.addEventListener("drop", (e) => {
  e.preventDefault();
  handleUpload(e.dataTransfer.files[0]);
});
</script>
</body>
</html>
